[project]
name = "terraform-vault-backend"
version = "0.4.2"
description = "A Vault backend for Terraform implemented as an HTTP server"
authors = [
  {name = "Emanuel Johnson Godin", email = "emanueljohnsongodin@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.165.0",
    "hvac==2.4.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "ruff==0.17.6",
  "pytest==9.1.1",
  "ty==0.0.110",
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvb"]
